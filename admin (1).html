<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신촌교회 예약 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--green:#1a7a5e;--green-light:#e8f5f0;--green-mid:#2ea87e;--green-dark:#0f5240;--red:#c0392b;--red-light:#fdecea;--blue:#1a5fa8;--blue-light:#e8f0fb;--amber:#b45309;--amber-light:#fef3c7;--gray0:#fff;--gray1:#f8f9fa;--gray2:#f1f3f5;--gray3:#e9ecef;--gray4:#dee2e6;--gray5:#adb5bd;--gray6:#6c757d;--gray7:#495057;--gray8:#343a40;--gray9:#212529;--shadow-sm:0 1px 3px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.08);--r-sm:6px;--r-md:10px;--r-lg:16px;--r-xl:24px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#f0f4f2;color:var(--gray9);min-height:100vh}
.site-header{background:var(--green-dark);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.logo{font-family:'DM Serif Display',serif;font-size:20px;display:flex;align-items:center;gap:10px}
.logo a{color:#fff;text-decoration:none}
.back-link{color:#fff;opacity:.8;font-size:13px;text-decoration:none}
.back-link:hover{opacity:1}
.container{max-width:1080px;margin:0 auto;padding:28px 16px 60px}
.card{background:var(--gray0);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);border:1px solid var(--gray3);margin-bottom:20px}
.sec-title{font-size:16px;font-weight:700;color:var(--gray9);margin-bottom:14px;display:flex;align-items:center;gap:8px}
button{font-family:inherit;cursor:pointer}
.btn{padding:9px 16px;border-radius:var(--r-md);border:1px solid var(--gray3);background:#fff;font-size:13px;font-weight:500;color:var(--gray8)}
.btn:hover{background:var(--gray1)}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-primary:hover{background:var(--green-dark)}
.btn-danger{background:#fff;color:var(--red);border-color:#f5c6c2}
.btn-danger:hover{background:var(--red-light)}

/* 로그인 게이트 */
#gate{position:fixed;inset:0;background:var(--green-dark);display:flex;align-items:center;justify-content:center;z-index:200}
.gate-box{background:#fff;border-radius:var(--r-lg);padding:32px 28px;width:300px;box-shadow:var(--shadow-md);text-align:center}
.gate-box h2{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:18px;color:var(--green-dark)}
.gate-box input{width:100%;padding:10px 12px;border:1px solid var(--gray3);border-radius:var(--r-md);font-size:15px;margin-bottom:12px;text-align:center;letter-spacing:2px}
.gate-box .btn-primary{width:100%;padding:11px}
.gate-err{color:var(--red);font-size:12px;margin-bottom:10px;display:none}

/* 여러 달 달력 */
.month-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.month-nav button{padding:8px 14px}
.month-range-label{font-size:14px;color:var(--gray7);font-weight:500;min-width:160px;text-align:center}
.months-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.months-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.months-grid{grid-template-columns:1fr}}
.mini-month{border:1px solid var(--gray3);border-radius:var(--r-md);padding:12px}
.mini-month-title{text-align:center;font-size:13px;font-weight:600;color:var(--gray8);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--gray3)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mini-dow{text-align:center;font-size:10px;color:var(--gray5);padding:2px 0 4px}
.mini-dow.sun{color:var(--red)}
.mini-day{position:relative;text-align:center;padding:4px 1px;font-size:11px;border-radius:6px;cursor:pointer;min-height:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.mini-day:hover{background:var(--green-light)}
.mini-day.mt{cursor:default}
.mini-day.mt:hover{background:none}
.mini-day.tod{font-weight:700;color:var(--green);outline:1px solid var(--green)}
.mini-day.sun{color:var(--red)}
.mini-day.holiday{color:var(--red)}
.mini-day.sel{background:var(--green)!important;color:#fff!important;font-weight:700}
.mini-hol{font-size:8px;color:var(--amber);line-height:1}
.mini-day.sel .mini-hol{color:#fff}
.mini-cnt{font-size:8px;background:var(--green-light);color:var(--green-dark);border-radius:8px;padding:0 3px;line-height:1.3}
.mini-day.sel .mini-cnt{background:rgba(255,255,255,.3);color:#fff}

/* 상세 예약 목록 */
.day-detail-title{font-size:15px;font-weight:700;margin-bottom:10px}
.empty-state{text-align:center;color:var(--gray5);font-size:13px;padding:20px 0}
.list-item{background:var(--gray1);border:1px solid var(--gray3);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px}
.li-main{font-size:13px;font-weight:600;color:var(--gray9);margin-bottom:2px}
.li-sub{font-size:12px;color:var(--gray6)}
.type-badge{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:4px}
.tb-room{background:var(--blue-light);color:var(--blue)}
.tb-car{background:var(--amber-light);color:var(--amber)}
.action-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* 공지 관리 */
#notice-text{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--gray3);border-radius:var(--r-md);font-family:inherit;font-size:14px;resize:vertical}
.notice-toolbar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px}
.toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray7)}
.notice-meta{font-size:12px;color:var(--gray5);margin-top:8px}
.toast-wrap{position:fixed;bottom:24px;left:0;right:0;display:flex;justify-content:center;z-index:300;pointer-events:none}
.toast{background:var(--gray9);color:#fff;padding:10px 18px;border-radius:var(--r-md);font-size:13px;opacity:0;transform:translateY(10px);transition:all .25s}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h2>🔑 관리자 로그인</h2>
    <div class="gate-err" id="gate-err">비밀번호가 틀렸습니다</div>
    <input type="password" id="gate-pw" placeholder="관리자 비밀번호" maxlength="8">
    <button class="btn btn-primary" onclick="tryLogin()">입장</button>
  </div>
</div>

<div class="site-header">
  <div class="logo"><a href="index.html">⛪ 신촌교회 예약 관리자</a></div>
  <a class="back-link" href="index.html">← 예약 페이지로</a>
</div>

<div class="container">

  <div class="card">
    <div class="sec-title">📝 예약하기</div>
    <p style="font-size:13px;color:var(--gray6);margin-bottom:12px">관리자 권한으로 대신 예약을 등록할 수 있습니다. 승인이 필요한 공간은 등록 후 위 달력에서 날짜를 눌러 바로 승인해 주세요.</p>
    <iframe src="index.html?embed=1" style="width:100%;height:820px;border:1px solid var(--gray3);border-radius:var(--r-md)"></iframe>
  </div>

  <div class="card">
    <div class="sec-title">📅 여러 달 예약 현황</div>
    <div class="month-nav">
      <button class="btn" onclick="shiftMonths(-6)">‹ 이전 6개월</button>
      <span class="month-range-label" id="range-label"></span>
      <button class="btn" onclick="shiftMonths(6)">다음 6개월 ›</button>
      <button class="btn" onclick="goToday()">오늘</button>
    </div>
    <div class="months-grid" id="months-grid"></div>
  </div>

  <div class="card" id="day-detail-card" style="display:none">
    <div class="day-detail-title" id="day-detail-title"></div>
    <div id="day-detail-body"></div>
  </div>

  <div class="card">
    <div class="sec-title">📢 오늘 예약 카톡 공지 만들기</div>
    <p style="font-size:13px;color:var(--gray6);margin-bottom:12px">오늘 확정된 예약을 카톡방에 붙여넣기 좋은 텍스트로 만들어 드립니다.</p>
    <button class="btn btn-primary" onclick="openTodayNotice()">오늘 공지 만들기</button>
    <div id="today-notice-preview" style="display:none;margin-top:12px;background:var(--gray1);border:1px solid var(--gray3);border-radius:var(--r-md);padding:14px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:340px;overflow-y:auto"></div>
    <div id="today-notice-copied" style="display:none;font-size:12px;color:var(--green-dark);margin-top:6px">✓ 복사 완료! 카톡방에 붙여넣으세요</div>
    <button class="btn" id="today-notice-copy-btn" style="display:none;margin-top:8px" onclick="copyTodayNotice()">클립보드에 복사</button>
  </div>

  <div class="card">
    <div class="sec-title">📢 공지사항 관리</div>
    <textarea id="notice-text" placeholder="예약 페이지 상단에 표시할 공지 내용을 입력하세요."></textarea>
    <div class="notice-toolbar">
      <label class="toggle-row"><input type="checkbox" id="notice-active"> 예약 페이지에 표시</label>
      <button class="btn btn-primary" onclick="saveNotice()">저장</button>
    </div>
    <div class="notice-meta" id="notice-meta"></div>
  </div>

</div>

<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, query, orderBy, updateDoc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCevQnEL6OKsBMzdZH4vjqgiUc2Hmp5omY",
  authDomain: "shinchon-church-booking.firebaseapp.com",
  projectId: "shinchon-church-booking",
  storageBucket: "shinchon-church-booking.firebasestorage.app",
  messagingSenderId: "117993103378",
  appId: "1:117993103378:web:32635831525908af13b8cb"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CALENDAR_SYNC_URL = 'https://script.google.com/macros/s/AKfycbxsNcY82ZZ3YisDkk_YEjI4pOqMs0tkjzTFyGySGcmzwQ4nPzujIfxKYsUpYsIY6NA/exec';
const CALENDAR_SECRET = 'shinchon-church-2026-booking-key';
const ADMIN_PW = '1234';

async function syncToCalendar(bookingData, bookingId) {
  try {
    await fetch(CALENDAR_SYNC_URL, {
      method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({secret: CALENDAR_SECRET, action: 'create',
        itemId: bookingData.itemId, itemType: bookingData.itemType, itemName: bookingData.itemName,
        date: bookingData.date, timeStart: bookingData.timeStart, timeEnd: bookingData.timeEnd,
        name: bookingData.name, phone: bookingData.phone, purpose: bookingData.purpose,
        people: bookingData.people, memo: bookingData.memo, bookingId: bookingId})
    });
  } catch(e) { console.log('캘린더 동기화 실패:', e); }
}
async function deleteFromCalendar(bookingData) {
  if(!bookingData) return;
  try {
    await fetch(CALENDAR_SYNC_URL, {
      method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({secret: CALENDAR_SECRET, action: 'deleteByBookingId',
        itemId: bookingData.itemId, itemType: bookingData.itemType, date: bookingData.date,
        timeStart: bookingData.timeStart, timeEnd: bookingData.timeEnd,
        bookingId: bookingData.docId || bookingData.bookingId})
    });
  } catch(e) { console.log('캘린더 삭제 실패:', e); }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ---------- 로그인 ---------- */
window.tryLogin=function(){
  const pw=document.getElementById('gate-pw').value;
  if(pw===ADMIN_PW){
    document.getElementById('gate').style.display='none';
    sessionStorage.setItem('adminOk','1');
  } else {
    document.getElementById('gate-err').style.display='block';
  }
}
document.getElementById('gate-pw').addEventListener('keydown',e=>{ if(e.key==='Enter') window.tryLogin(); });
if(sessionStorage.getItem('adminOk')==='1'){ document.getElementById('gate').style.display='none'; }

/* ---------- 날짜/공휴일 유틸 ---------- */
const DOW=['일','월','화','수','목','금','토'];
const MNAMES=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const HOLIDAYS={
  '2026-01-01':'신정','2026-02-16':'설연휴','2026-02-17':'설날','2026-02-18':'설연휴',
  '2026-03-01':'삼일절','2026-03-02':'대체공휴일','2026-05-01':'노동절','2026-05-05':'어린이날',
  '2026-05-24':'부처님오신날','2026-05-25':'대체공휴일','2026-06-06':'현충일','2026-07-17':'제헌절',
  '2026-08-15':'광복절','2026-08-17':'대체공휴일','2026-09-24':'추석연휴','2026-09-25':'추석',
  '2026-09-26':'추석연휴','2026-10-03':'개천절','2026-10-05':'대체공휴일','2026-10-09':'한글날',
  '2026-12-25':'성탄절',
  '2027-01-01':'신정','2027-02-06':'설연휴','2027-02-07':'설날','2027-02-08':'설연휴','2027-02-09':'대체공휴일',
  '2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-05':'어린이날','2027-05-13':'부처님오신날',
  '2027-06-06':'현충일','2027-07-17':'제헌절','2027-08-15':'광복절','2027-08-16':'대체공휴일',
  '2027-09-14':'추석연휴','2027-09-15':'추석','2027-09-16':'추석연휴','2027-10-03':'개천절',
  '2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일'
};
function isHoliday(ds){return HOLIDAYS[ds]||null;}
function fd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fdDisp(s){const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')';}

/* ---------- 오늘 공지 만들기 ---------- */
window.openTodayNotice=function(){
  const todayStr=fd(new Date());
  const todays=bks.filter(b=>b.date===todayStr && b.status==='confirmed')
    .sort((a,b)=>(a.timeStart||'').localeCompare(b.timeStart||''));
  let text='📢 '+fdDisp(todayStr)+' 예약 현황\n';
  if(todays.length===0){
    text+='오늘 예정된 예약이 없습니다.';
  } else {
    todays.forEach(b=>{
      const timeStr=(b.timeStart||'')+'–'+(b.timeEnd||'');
      const plateStr=b.plate?' ('+b.plate+')':'';
      const purposeStr=b.purpose?' '+b.purpose:'';
      text+='・ '+b.itemName+plateStr+' '+timeStr+purposeStr+'\n';
    });
  }
  text+='\n문의: 행정실';
  const prev=document.getElementById('today-notice-preview');
  prev.textContent=text;
  prev.style.display='block';
  document.getElementById('today-notice-copied').style.display='none';
  document.getElementById('today-notice-copy-btn').style.display='inline-block';
}
window.copyTodayNotice=function(){
  const text=document.getElementById('today-notice-preview').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById('today-notice-copied').style.display='block';
  }).catch(()=>{
    showToast('복사에 실패했습니다. 텍스트를 직접 선택해 복사해 주세요.');
  });
}

/* ---------- 상태 ---------- */
const today=new Date();
let baseY=today.getFullYear(), baseM=today.getMonth();
const MONTHS_SHOWN=6;
let bks=[];
let selDate=null;

/* ---------- 예약 실시간 구독 ---------- */
onSnapshot(query(collection(db,'bookings'),orderBy('createdAt','desc')), (snap)=>{
  bks=snap.docs.map(d=>({...d.data(),docId:d.id}));
  renderMonths();
  if(selDate) renderDayDetail(selDate);
});

/* ---------- 여러 달 렌더 ---------- */
function shiftMonths(n){
  const t=baseY*12+baseM+n;
  baseY=Math.floor(t/12); baseM=((t%12)+12)%12;
  renderMonths();
}
window.shiftMonths=shiftMonths;
window.goToday=function(){ baseY=today.getFullYear(); baseM=today.getMonth(); renderMonths(); }

function buildMiniMonth(year,month){
  const first=new Date(year,month,1).getDay();
  const total=new Date(year,month+1,0).getDate();
  const todStr=fd(today);
  const counts={};
  bks.forEach(b=>{ counts[b.date]=(counts[b.date]||0)+1; });
  let h='<div class="mini-month"><div class="mini-month-title">'+year+'년 '+MNAMES[month]+'</div><div class="mini-grid">';
  h+=DOW.map((d,i)=>'<div class="mini-dow'+(i===0?' sun':'')+'">'+d+'</div>').join('');
  for(let i=0;i<first;i++) h+='<div class="mini-day mt"></div>';
  for(let d=1;d<=total;d++){
    const dt=new Date(year,month,d), ds=fd(dt);
    const isSun=dt.getDay()===0, isTod=ds===todStr, isSel=ds===selDate;
    const hol=isHoliday(ds);
    const cnt=counts[ds]||0;
    let cls='mini-day';
    if(isSel)cls+=' sel'; else if(isTod)cls+=' tod';
    if(isSun)cls+=' sun';
    if(hol)cls+=' holiday';
    const holEl=hol?'<div class="mini-hol">'+hol+'</div>':'';
    const cntEl=cnt>0?'<div class="mini-cnt">'+cnt+'</div>':'';
    h+='<div class="'+cls+'" onclick="pickDay(\''+ds+'\')">'+d+holEl+cntEl+'</div>';
  }
  h+='</div></div>';
  return h;
}

function renderMonths(){
  let h='';
  let y=baseY, m=baseM;
  for(let i=0;i<MONTHS_SHOWN;i++){
    h+=buildMiniMonth(y,m);
    m++; if(m>11){m=0;y++;}
  }
  document.getElementById('months-grid').innerHTML=h;
  let ey=baseY, em=baseM+MONTHS_SHOWN-1;
  if(em>11){ey+=Math.floor(em/12); em=em%12;}
  document.getElementById('range-label').textContent=baseY+'년 '+MNAMES[baseM]+' ~ '+ey+'년 '+MNAMES[em];
}

/* ---------- 날짜 클릭 -> 상세 ---------- */
window.pickDay=function(ds){
  selDate=ds;
  renderMonths();
  renderDayDetail(ds);
  document.getElementById('day-detail-card').scrollIntoView({behavior:'smooth',block:'start'});
}

function renderDayDetail(ds){
  const card=document.getElementById('day-detail-card');
  card.style.display='block';
  document.getElementById('day-detail-title').textContent=fdDisp(ds)+' 예약 현황';
  const dayBks=bks.filter(b=>b.date===ds).sort((a,b)=>(a.timeStart||'').localeCompare(b.timeStart||''));
  const body=document.getElementById('day-detail-body');
  if(dayBks.length===0){
    body.innerHTML='<div class="empty-state">📭 이 날 예약이 없습니다</div>';
    return;
  }
  body.innerHTML=dayBks.map(b=>{
    const badge='<span class="type-badge '+(b.itemType==='car'?'tb-car':'tb-room')+'">'+(b.itemType==='car'?'차량':'방')+'</span>';
    const pendingBadge=b.status==='pending'?'<span class="type-badge" style="background:#fef3c7;color:#92400e">⏳ 승인대기</span>':'';
    const timeStr=b.timeStart&&b.timeEnd?b.timeStart+' ~ '+b.timeEnd:(b.time||'');
    const actions=b.status==='pending'
      ? '<div class="action-row"><button class="btn btn-primary" onclick="approveBk(\''+b.docId+'\')">승인</button><button class="btn btn-danger" onclick="cancelBk(\''+b.docId+'\')">거절</button></div>'
      : '<div class="action-row"><button class="btn btn-danger" onclick="cancelBk(\''+b.docId+'\')">취소</button></div>';
    return '<div class="list-item"><div class="li-main">'+b.itemName+(b.plate?' ('+b.plate+')':'')+' · '+timeStr+' '+badge+' '+pendingBadge+'</div>'+
      '<div class="li-sub">'+b.name+(b.people?' (👥 '+b.people+'명)':'')+(b.purpose?' — '+b.purpose:'')+(b.memo?'<div style="margin-top:4px;color:#888;font-size:12px;font-style:italic">📝 '+b.memo+'</div>':'')+'</div>'+
      actions+'</div>';
  }).join('');
}

window.approveBk=async function(docId){
  const bk=bks.find(b=>b.docId===docId);
  if(!bk) return;
  try{
    if(bk.groupId){
      const groupBks=bks.filter(b=>b.groupId===bk.groupId);
      if(!confirm('여러 날 예약입니다 ('+groupBks.length+'건). 전체를 승인할까요?')) return;
      for(const g of groupBks){ await updateDoc(doc(db,'bookings',g.docId), {status:'confirmed'}); syncToCalendar(g,g.docId); }
      showToast('✅ 여러 날 예약 '+groupBks.length+'건이 승인되었습니다');
    } else {
      await updateDoc(doc(db,'bookings',docId), {status:'confirmed'});
      syncToCalendar(bk,docId);
      showToast('✅ 예약이 승인되었습니다');
    }
  }catch(e){ showToast('오류가 발생했습니다: '+e.message); }
}

window.cancelBk=async function(docId){
  const bk=bks.find(b=>b.docId===docId);
  if(!bk) return;
  const targets = bk.groupId ? bks.filter(b=>b.groupId===bk.groupId) : [bk];
  const label = targets.length>1 ? '여러 날 예약 '+targets.length+'건을' : '이 예약을';
  if(!confirm(label+' 취소(삭제)할까요?')) return;
  try{
    for(const t of targets){
      if(t.status!=='pending'){ deleteFromCalendar(t); }
      await deleteDoc(doc(db,'bookings',t.docId));
    }
    showToast('🗑️ 취소되었습니다');
  }catch(e){ showToast('오류가 발생했습니다: '+e.message); }
}

/* ---------- 공지사항 관리 ---------- */
const noticeRef=doc(db,'settings','notice');
getDoc(noticeRef).then(snap=>{
  if(snap.exists()){
    const d=snap.data();
    document.getElementById('notice-text').value=d.text||'';
    document.getElementById('notice-active').checked=!!d.active;
    if(d.updatedAtStr) document.getElementById('notice-meta').textContent='마지막 저장: '+d.updatedAtStr;
  }
});
window.saveNotice=async function(){
  const text=document.getElementById('notice-text').value;
  const active=document.getElementById('notice-active').checked;
  const now=new Date();
  const updatedAtStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  try{
    await setDoc(noticeRef, {text, active, updatedAtStr});
    document.getElementById('notice-meta').textContent='마지막 저장: '+updatedAtStr;
    showToast('📢 공지사항이 저장되었습니다');
  }catch(e){ showToast('오류가 발생했습니다: '+e.message); }
}

renderMonths();
</script>
